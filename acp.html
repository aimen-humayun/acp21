<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Random Numbers</h1>
    <script>
        var number="";
        for (i=0; i<11; i++){
            number=number+i;
            document.write(number+"<br>");
        }
    </script>
</body>
</html>
